spring.application.name=Groomify

# --- Datasource (PostgreSQL) ---
# Override secrets via environment variables in any real deployment.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/groomify}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:groomify}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate ---
# Dialect is inferred from the JDBC URL (Postgres in prod, H2 in tests).
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.batch_size=2000

server.servlet.session.timeout=28800

spring.jackson.default-property-inclusion=NON_NULL

# --- Geonames ---
geoname.base.child=https://www.geonames.org/childrenJSON?geonameId={geoNameId}&style=short
base.geoname=1269750
geoname.postal.codes.by.city=https://api.geonames.org/postalCodeSearchJSON?placename={city}&username=${GEONAMES_USERNAME:your-geonames-username}&style=short
geoname.postal.code.validate=https://api.geonames.org/postalCodeLookupJSON?username=${GEONAMES_USERNAME:your-geonames-username}&postalcode={postalcode}&country={countryCode}&style=short&placename={city}

# Set to true to seed AddressMeta from geonames at startup (one-time, blocking, slow).
groomify.bootstrap.address-meta=false

# --- Logging ---
logging.level.org.springframework=info
logging.level.com.uditgoel=info
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} | %msg%n
logging.pattern.file=[%thread] %-5level %logger{36} - %d{yyyy-MM-dd HH:mm:ss} | %msg%n
logging.file.name=./logs/groomify.log

spring.mandatory-file-encoding=UTF-8
file.encoding=UTF-8

# --- Password policy (shared) ---
customer.password.expiry.policy=true
customer.password.expiry.policy.days=90
customer.name.search.min.length=5
customer.password.regex=(?=.*[A-Z]{1})(?=.*[!@#$&*_])(?=.*[0-9]{1})(?=.*[a-z]{1}).{8,16}
customer.password.notes=Ensure password has at least <ul><li>One uppercase letter</li><li>One special character (!@#$&)</li><li>One digit</li><li>One lowercase letter</li><li>8 to 16 characters</li></ul>

employee.password.expiry.policy=true
employee.password.expiry.policy.days=180
employee.fname.default=empanonymous
employee.pass.default=${EMPLOYEE_DEFAULT_PASSWORD:}
employee.password.regex=(?=.*[A-Z]{1})(?=.*[!@#$&*_])(?=.*[0-9]{1})(?=.*[a-z]{1}).{8,16}
employee.password.notes=Ensure password has at least <ul><li>One uppercase letter</li><li>One special character (!@#$&)</li><li>One digit</li><li>One lowercase letter</li><li>8 to 16 characters</li></ul>
employee.name.search.min.length=5

# --- JWT / refresh token ---
# Generate with: openssl rand -base64 64
# HS512 requires >= 64 bytes; the app refuses to start otherwise.
app.jwtSecret=${APP_JWT_SECRET:}
app.jwtExpirationInMs=900000
app.jwt.refresh.token.length=40
app.jwt.refresh.expirationInMs=5184000000
jwt.access.token.key.format=TokenType/[access]/Token/[%s]
jwt.refresh.token.key.format=TokenType/[refresh]/Token/[%s]

# --- AES key for the JWT subject payload (Base64-encoded 16/24/32 bytes) ---
# Generate with: openssl rand -base64 32
app.aes.key=${APP_AES_KEY:}

# --- RSA keys for refresh-token encryption (Base64 X.509 / PKCS#8) ---
# Generate with:
#   openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
#   openssl pkcs8 -topk8 -inform PEM -outform DER -in private.pem -nocrypt | base64
#   openssl rsa -in private.pem -pubout -outform DER | base64
rsa.public.key=${RSA_PUBLIC_KEY:}
rsa.private.key=${RSA_PRIVATE_KEY:}

# --- Redis ---
datasource.redis.master.host=${REDIS_MASTER_HOST:127.0.0.1}
datasource.redis.master.port=${REDIS_MASTER_PORT:6379}
datasource.redis.master.pass=${REDIS_MASTER_PASS:}
datasource.redis.slave.host=${REDIS_SLAVE_HOST:127.0.0.1}
datasource.redis.slave.port=${REDIS_SLAVE_PORT:6380}
datasource.redis.slave.pass=${REDIS_SLAVE_PASS:}

# --- CORS (comma-separated allowed origins; empty = block all) ---
groomify.cors.allowed-origins=${GROOMIFY_CORS_ALLOWED_ORIGINS:}
