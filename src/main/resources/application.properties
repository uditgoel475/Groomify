spring.application.name=Groomify

# --- Datasource (PostgreSQL) ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/groomify
spring.datasource.username=groomify
spring.datasource.password=changeme
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.batch_size=2000

server.servlet.session.timeout=28800

spring.jackson.default-property-inclusion=NON_NULL

# --- Geonames ---
geoname.base.child=http://www.geonames.org/childrenJSON?geonameId={geoNameId}&style=short
base.geoname=1269750
geoname.postal.codes.by.city=api.geonames.org/postalCodeSearchJSON?placename={city}&username=your-geonames-username&style=short
geoname.postal.code.validate=http://api.geonames.org/postalCodeLookupJSON?username=your-geonames-username&postalcode={postalcode}&country={countryCode}&style=short&placename={city}

# --- Logging ---
logging.level.org.springframework=info
logging.level.com.uditgoel=debug
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} | %msg%n
logging.pattern.file=[%thread] %-5level %logger{36} - %d{yyyy-MM-dd HH:mm:ss} | %msg%n
logging.file.name=./logs/groomify.log

spring.mandatory-file-encoding=UTF-8
file.encoding=UTF-8

# --- Password policy (shared) ---
customer.password.expiry.policy=true
customer.password.expiry.policy.days=90
customer.name.search.min.length=5
customer.password.regex=(?=.*[A-Z]{1})(?=.*[!@#$&*_])(?=.*[0-9]{1})(?=.*[a-z]{1}).{8,16}
customer.password.notes=Ensure password has at least <ul><li>One uppercase letter</li><li>One special character (!@#$&)</li><li>One digit</li><li>One lowercase letter</li><li>8 to 16 characters</li></ul>

employee.password.expiry.policy=true
employee.password.expiry.policy.days=180
employee.fname.default=empanonymous
employee.pass.default=pass123
employee.password.regex=(?=.*[A-Z]{1})(?=.*[!@#$&*_])(?=.*[0-9]{1})(?=.*[a-z]{1}).{8,16}
employee.password.notes=Ensure password has at least <ul><li>One uppercase letter</li><li>One special character (!@#$&)</li><li>One digit</li><li>One lowercase letter</li><li>8 to 16 characters</li></ul>
employee.name.search.min.length=5

# --- JWT / refresh token ---
# Generate with: openssl rand -base64 64
app.jwtSecret=replace-with-a-long-random-string-min-64-chars
app.jwtExpirationInMs=900000
app.jwt.refresh.token.length=40
app.jwt.refresh.expirationInMs=5184000000
jwt.access.token.key.format=TokenType/[access]/Token/[%s]
jwt.refresh.token.key.format=TokenType/[refresh]/Token/[%s]

# --- RSA keys for refresh-token encryption (Base64 X.509 / PKCS#8) ---
# Generate with:
#   openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048
#   openssl pkcs8 -topk8 -inform PEM -outform DER -in private.pem -nocrypt | base64
#   openssl rsa -in private.pem -pubout -outform DER | base64
rsa.public.key=replace-with-base64-x509-public-key
rsa.private.key=replace-with-base64-pkcs8-private-key

# --- Redis ---
datasource.redis.master.host=127.0.0.1
datasource.redis.master.port=6379
datasource.redis.master.pass=changeme
datasource.redis.slave.host=127.0.0.1
datasource.redis.slave.port=6380
datasource.redis.slave.pass=changeme
