spring.application.name=LookAtMe
spring.datasource.name=lookatme
spring.jpa.show-sql=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/lookatme?createDatabaseIfNotExist=true&serverTimezone=UTC&rewriteBatchedStatements=true&character_set_server=utf8mb4&useUnicode=yes&collation_database=utf8mb4_unicode_ci
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.SecurityAutoConfiguration
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.max-active=50
server.servlet.session.timeout=28800

spring.jackson.default-property-inclusion = NON_NULL

# Validate the connection before borrowing it from the pool.
spring.datasource.tomcat.test-on-borrow=true

#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=2000

geoname.base.child=http://www.geonames.org/childrenJSON?geonameId={geoNameId}&style=short
base.geoname = 1269750
geoname.postal.codes.by.city=api.geonames.org/postalCodeSearchJSON?placename={city}&username=ugoel1&style=short
geoname.postal.code.validate=http://api.geonames.org/postalCodeLookupJSON?username=ugoel1&postalcode={postalcode}&country={countryCode}&style=short&placename={city}

# To set logs level as per your need.
logging.level.org.springframework = debug
logging.level.com.niit = TRACE
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} | %msg%n
logging.pattern.file=[%thread] %-5level %logger{36} - %d{yyyy-MM-dd HH:mm:ss} | %msg%n
# To store logs to external file
# Here use strictly forward "/" slash for both Windows, Linux or any other os, otherwise, your logs it won't work.      
logging.file=C:/lookatme.log
#logging.file.max-size: 10MB

spring.mandatory-file-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
file.encoding = UTF-8

customer.password.expiry.policy = true
customer.password.expiry.policy.days = 90
customer.name.search.min.length = 5
customer.password.regex = (?=.*[A-Z]{1})(?=.*[!@#$&*_])(?=.*[0-9]{1})(?=.*[a-z]{1}).{8,16}
customer.password.notes = Ensure password has atleast <ul><li>One uppercase letters.</li><li>One special case letter (!@#$&)</li><li>One digit</li><li>One lowercase letter</li><li>password range must be 8 to 16 characters</li></ul>

