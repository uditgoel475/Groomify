# Test-only overrides. Boots the full Spring context against H2 (PostgreSQL compat mode)
# and an in-process Redis server (started by EmbeddedRedisInitializer). NEVER use these
# in any non-test environment.

# H2 in PostgreSQL compat mode + Hibernate H2 dialect.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:groomify;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.show-sql=false

# Redis host/port + RSA keys are injected by EmbeddedRedisInitializer.

# 64-byte HMAC key (HS512 just needs the bytes).
app.jwtSecret=test-secret-test-secret-test-secret-test-secret-test-secret-1234

# 32-byte AES key (256-bit) — Base64-encoded.
app.aes.key=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

# Skip slow address-meta bootstrap.
groomify.bootstrap.address-meta=false

# Geonames URLs unused at runtime in tests but must be present (validated as @Value).
geoname.base.child=https://example.invalid/childrenJSON?geonameId={geoNameId}
base.geoname=1
geoname.postal.codes.by.city=https://example.invalid/postalCodeSearchJSON?placename={city}
geoname.postal.code.validate=https://example.invalid/postalCodeLookupJSON?postalcode={postalcode}&country={countryCode}&placename={city}

# Logging
logging.level.org.springframework=warn
logging.level.com.uditgoel=info
logging.level.root=warn
